vmType: vz
arch: aarch64
cpus: 4
memory: 4GiB
disk: 20GiB
images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: aarch64
mountType: virtiofs
mounts:
  - location: "~/Documents/my-project/guardian-angel"
    mountPoint: "/mnt/guardian-angel"
    writable: false
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y curl unzip git ca-certificates
  - mode: user
    script: |
      #!/bin/bash
      set -eux
      curl -fsSL https://bun.sh/install | bash
      # `node_modules/.bin/tsc` is a node shebang script, so a real node binary
      # must exist. Install it into the user's home (no sudo needed).
      curl -fsSL https://fnm.vercel.app/install | bash
      export PATH="$HOME/.local/share/fnm:$PATH"
      eval "$(fnm env)"
      fnm install --lts
      fnm default lts-latest
      echo 'export PATH="$HOME/.local/share/fnm:$PATH"' >> "$HOME/.bashrc"
      echo 'eval "$(fnm env)"' >> "$HOME/.bashrc"
